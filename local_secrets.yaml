# Local development secrets
# This file should be added to .gitignore for security
# This structure matches what would be stored in AWS Secrets Manager

api:
  public:
    key: "your-api-key-here"
  private:
    admin_key: "your-admin-key"

database:
  host: "localhost"
  port: 5432
  username: "dev_user"
  password: "dev_password"
  name: "dev_database"

aws:
  region: "us-east-1"
  access_key: "your-local-access-key"
  secret_key: "your-local-secret-key"

# Add more hierarchical configurations as needed